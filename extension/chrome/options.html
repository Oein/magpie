<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Magpie options</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 18px; }
    label { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
    .hint { font-size: 12px; opacity: .7; }
  </style>
</head>
<body>
  <h1>Magpie</h1>
  <label>
    <input type="checkbox" id="enabled">
    Intercept browser downloads and send them to Magpie
  </label>
  <p class="hint">
    When off, downloads behave normally. The dynamic download path is decided by
    your <code>path-resolver.js</code> script in the Magpie config directory.
  </p>
  <script src="options.js"></script>
</body>
</html>
