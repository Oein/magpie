<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px/1.4 system-ui, sans-serif; width: 340px; margin: 0; padding: 10px 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
    .status { font-size: 11px; padding: 2px 6px; border-radius: 10px; }
    .ok { background: #2f855a; color: #fff; }
    .down { background: #c53030; color: #fff; }
    .item { padding: 6px 0; border-top: 1px solid rgba(128,128,128,.25); }
    .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar { height: 5px; background: rgba(128,128,128,.25); border-radius: 3px; margin: 4px 0; overflow: hidden; }
    .fill { height: 100%; background: #2b6cb0; width: 0%; }
    .meta { font-size: 11px; opacity: .75; display: flex; justify-content: space-between; }
    .empty { opacity: .6; padding: 12px 0; text-align: center; }
  </style>
</head>
<body>
  <h1>Magpie <span id="status" class="status down">offline</span></h1>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
