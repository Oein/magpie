[workspace]
resolver = "2"
members = [
    "crates/magpie-proto",
    "crates/magpie-core",
    "crates/magpie-script",
    "crates/magpie-daemon",
    "crates/magpie-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["better-fdm contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "net", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "gzip", "brotli"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = "z"      # optimize for size -> smaller binary, lower footprint
lto = true
codegen-units = 1
strip = true
panic = "abort"
